    }).join("");

    const activeRow = findingListEl.querySelector(".finding-row.active");
    if (activeRow) {
      activeRow.scrollIntoView({ block: "nearest" });
    }
  }

  /* The recovered API graph, laid out in columns by dependency depth (sources left, outputs right). */
  function renderWorkflowSVG(wf) {
    const g = (wf && wf.graph) || {};
    const ids = Object.keys(g).filter(k => g[k] && typeof g[k] === "object" && g[k].class_type);
    if (!ids.length) {
      const none = { id: "—", title: "No API graph", detail: "This workflow record has no decodable API graph." };
      return { svg: `<div class="empty-state">No API graph to draw.</div>`, selNode: none };
    }
    const isLink = v => Array.isArray(v) && v.length === 2 && ids.includes(String(v[0]));
    const edges = [];
    ids.forEach(id => Object.entries(g[id].inputs || {}).forEach(([name, v]) => {
      if (isLink(v)) edges.push({ from: String(v[0]), to: id, name, socket: v[1] });
    }));
    const depth = Object.create(null);
    const visit = (id, seen) => {
      if (depth[id] !== undefined) return depth[id];
      if (seen.has(id)) return 0;  /* a cycle is drawn, not followed */
      seen.add(id);
      const preds = edges.filter(e => e.to === id).map(e => visit(e.from, seen) + 1);
      seen.delete(id);
      return (depth[id] = preds.length ? Math.max(...preds) : 0);
    };
    ids.forEach(id => visit(id, new Set()));
    const byCol = {};
    ids.forEach(id => (byCol[depth[id]] = byCol[depth[id]] || []).push(id));
    /* Top to bottom: one row per dependency depth (ComfyUI graphs are deeper than they are wide). */
    const W = 150, H = 40, GX = 14, GY = 28, PAD = 8;
    const pos = Object.create(null);
    const levels = Object.keys(byCol).map(Number).sort((a, b) => a - b);
    const widest = Math.max(...levels.map(l => byCol[l].length));
    const vw = PAD * 2 + widest * W + (widest - 1) * GX;
    levels.forEach((l, li) => {
      byCol[l].sort((a, b) => (Number(a) - Number(b)) || a.localeCompare(b));
      const rowWidth = byCol[l].length * W + (byCol[l].length - 1) * GX;
      const left = (vw - rowWidth) / 2;
      byCol[l].forEach((id, i) => { pos[id] = { x: left + i * (W + GX), y: PAD + li * (H + GY) }; });
    });
    const vh = PAD * 2 + levels.length * H + (levels.length - 1) * GY;
    const literal = v => typeof v === "string" ? JSON.stringify(v.length > 60 ? v.slice(0, 60) + "…" : v) : JSON.stringify(v);
    const nodes = ids.map(id => {
      const n = g[id], ins = Object.entries(n.inputs || {});
      const scalars = ins.filter(([, v]) => !isLink(v) && (typeof v !== "object" || v === null));
      const firstScalar = scalars.find(([k]) => !/text|prompt/i.test(k)) || scalars[0];
      const title = n.class_type.length > 20 ? n.class_type.slice(0, 19) + "…" : n.class_type;
      const sub = firstScalar ? `${id} · ${firstScalar[0]} ${String(firstScalar[1]).slice(0, 14)}` : `node ${id}`;
      const detail = `class_type: ${n.class_type} · ` + ins.map(([k, v]) => isLink(v) ? `${k} ← [${v[0]},${v[1]}]` : `${k}: ${literal(v)}`).join(", ");
      return { id, title, sub, detail, ...pos[id] };
    });
    const selNode = nodes.find(n => n.id === state.selectedNodeId)
      || nodes.find(n => /sampler/i.test(g[n.id].class_type)) || nodes[0];
    const paths = edges.map(e => {
      const a = pos[e.from], b = pos[e.to];
      const x1 = a.x + W / 2, y1 = a.y + H, x2 = b.x + W / 2, y2 = b.y, my = (y1 + y2) / 2;
      return `<path class="wf-edge" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" marker-end="url(#wfArrow)"><title>${esc(e.from)} → ${esc(e.to)}.${esc(e.name)}</title></path>`;
    });
    const svg = `
      <svg class="graph-svg" viewBox="0 0 ${vw} ${vh}" style="width:${vw}px;max-width:100%;height:auto;display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${ids.length}-node ComfyUI workflow graph">
        <defs>
          <marker id="wfArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 7 4 L 0 7 z" fill="var(--ink-muted)"/>
          </marker>
        </defs>
        ${paths.join("")}
        ${nodes.map(n => `
          <g class="wf-node ${n.id === selNode.id ? "selected" : ""}" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="Inspect node ${esc(n.id)}: ${esc(n.title)}">
            <rect class="node-box" x="${n.x}" y="${n.y}" width="${W}" height="${H}" rx="5"/>
            <text class="node-title" x="${n.x + 8}" y="${n.y + 16}">${esc(n.title)}</text>
            <text class="node-sub" x="${n.x + 8}" y="${n.y + 31}">${esc(n.sub)}</text>
          </g>
        `).join("")}
      </svg>
    `;
    return { svg, selNode };
  }

  /* Where an image sits in memory, without printing the same offset twice. */
  function locationText(im) {
    if (!present(im.process)) return present(im.offset) ? im.offset : DASH;
    return present(im.offset) && !String(im.process).includes(im.offset) ? `${im.process} @ ${im.offset}` : im.process;
  }

  /* An image with no metadata key in a tiered E1-E3 finding was tied to the job by an image comparison. */
  function linkedByComparison(f, im) {
    return im.link === "UNASSOCIATED" && ["E1", "E2", "E3"].includes(f.tier);
  }

  function linkHtml(f, im) {
    if (linkedByComparison(f, im)) return `<span class="term" title="UNASSOCIATED">No metadata link</span> (tied by image comparison; see rationale)`;
    return termHtml(HUMAN_LINK, im.link) + (present(im.key) ? ` via ${keysHtml(im.key)}` : "");
  }

  /* Render Centre Workspace */
  function renderCentre(list, f) {
    if (!f) {
      centreInnerEl.innerHTML = `<div class="card"><div class="card-body empty-state">Select a finding from the left rail to inspect evidence, workflow, and provenance.</div></div>`;
      return;
    }

    const idx = list.findIndex(x => x.id === f.id);
    const tierInfo = TIERS[f.tier];
    const tierShort = f.tierLabel || tierInfo.short;
    const tierDesc = f.tierDesc || tierInfo.desc;
    const allImgs = f.images || [];
    const imgs = visualImages(f);
    const zeroRowImgs = allImgs.filter(im => im.container);
    if (state.selectedCopyIdx >= imgs.length) state.selectedCopyIdx = 0;
    const activeCopy = imgs[state.selectedCopyIdx] || null;
    const r = f.replay;
    const isRaw = !!(r && r.observation === "RAW_WHOLE_FRAME");

    /* 1. Finding hero: tier, plain meaning, promotion (if any), rationale, job. */
    const promoted = present(f.baseTier) && f.baseTier !== f.tier;
    const promotionHtml = promoted ? `
          <div class="promotion-callout t-${f.tier}">
            <strong>Promoted ${esc(f.baseTier)} → ${esc(f.tier)}</strong>
            <span>${r ? `by ${isRaw ? "the raw whole-frame match of lab replay" : "lab replay"} <span class="mono">${esc(r.id)}</span>.` : "by a later observation recorded in this case."}
              The extraction rationale below explains the ${esc(f.baseTier)} tier the finding started from.</span>
          </div>` : "";
    const job = f.job || {};
    const hasJob = [job.promptId, job.queued, job.duration, job.status].some(present);
    const statusClass = job.status === "success" ? "status-ok" : "status-warn";
    const jobHtml = hasJob ? `
          <div class="job-strip">
            ${present(job.promptId) ? `<div class="job-kv"><span class="job-k">Prompt ID</span> <span class="job-v mono">${esc(job.promptId)}</span></div>` : ""}
            ${present(job.queued) ? `<div class="job-kv"><span class="job-k">Queued</span> <span class="job-v mono">${esc(job.queued)}</span></div>` : ""}
            ${present(job.duration) ? `<div class="job-kv"><span class="job-k">Run</span> <span class="job-v mono">${esc(job.duration)}</span></div>` : ""}
            ${present(job.status) ? `<div class="job-kv"><span class="job-k">Status</span> <span class="status-pill ${statusClass}">${esc(job.status)}</span></div>` : ""}
          </div>` : "";
    const heroHtml = `
      <section class="card">
        <div class="finding-hero">
          <div class="finding-hero-top">
            <div class="finding-title-wrap t-${f.tier}" title="${esc(f.tier + " — " + tierShort + ": " + tierDesc)}">
              <span class="tier-badge t-${f.tier}">${f.tier}</span>
              <span class="finding-id-lg">${esc(f.id)}</span>
              <span class="finding-tier-name">${esc(tierShort)}</span>
              ${activeCopy && activeCopy.derived ? `<span class="derived-badge" title="Reconstructed from recovered data (e.g. a decoded latent), not recovered as-is">◈ DERIVED</span>` : ""}
              ${r && !activeCopy ? `<span class="replay-badge" title="Generated in the lab by replaying the recovered workflow; not found in memory">↻ LAB REPLAY</span>` : ""}
            </div>
            <div class="nav-pager">
              <button class="btn btn-sm btn-icon" id="prevFindingBtn" ${idx <= 0 ? "disabled" : ""} title="Previous finding (↑)" aria-label="Previous finding">‹</button>
              <span class="pager-text">${idx + 1} of ${list.length}</span>
              <button class="btn btn-sm btn-icon" id="nextFindingBtn" ${idx >= list.length - 1 ? "disabled" : ""} title="Next finding (↓)" aria-label="Next finding">›</button>
            </div>
          </div>
          <p class="tier-desc">${esc(tierDesc)}</p>
          ${promotionHtml}
          <p class="rationale-text">${promoted ? `<span class="rationale-label">Extraction rationale (as ${esc(f.baseTier)})</span>` : ""}${annotateTokens(esc(f.rationale))}</p>
          ${jobHtml}
        </div>
      </section>
    `;

    /* 2. Image Evidence: only when there is something to look at or account for. */
    let imageCardHtml = "";
    if (imgs.length > 0 || r || zeroRowImgs.length > 0) {
      const thumbsHtml = imgs.length > 1 ? `
        <div class="copy-strip" role="tablist" aria-label="Recovered images">
          ${imgs.map((im, i) => `
            <button class="copy-card ${i === state.selectedCopyIdx ? "active" : ""}" data-copy-idx="${i}" role="tab" aria-selected="${i === state.selectedCopyIdx}">
              <div class="copy-thumb">${makeArtSVG(im.uri, { thumb: true, partialPct: im.partialPct, rowsLabel: im.rows, size: im.size, omitted: im.omitted })}</div>
              <div class="copy-meta">
                <div class="copy-id-row">
                  <span class="copy-id" title="${esc(im.id)}">${esc(im.id)}</span>
                </div>
                <div class="copy-kind">${esc(im.kind)}</div>
                <div class="copy-tags">
                  <span>${esc(im.rows || (im.completeness === "COMPLETE" ? "complete" : "partial"))}</span>
                  ${im.derived ? `<span class="derived-badge" style="padding:0 4px;font-size:9px">◈ DERIVED</span>` : `<span title="${esc(im.link)}">· ${esc(linkedByComparison(f, im) ? "tied by comparison" : human(HUMAN_LINK, im.link).toLowerCase())}</span>`}
                  ${im.comparison ? `<span class="cmp-tag ${cmpClass(im.comparison.status)}" title="${esc(im.comparison.status + ": " + im.comparison.label)}">${esc(humanStatus(im.comparison.status).toLowerCase())}</span>` : ""}
                </div>
              </div>
            </button>
          `).join("")}
        </div>
      ` : "";

      const sel = r && r.targetSelection;
      const selectionHtml = sel ? `
              <li><strong>Target selection:</strong> ${termHtml(HUMAN_SEL_REASON, sel.selection_reason)}${(sel.candidate_artifact_ids || []).length ? ` · candidates <span class="mono">${esc(sel.candidate_artifact_ids.join(", "))}</span>` : ""}${(sel.excluded_candidates || []).length ? ` · excluded ${sel.excluded_candidates.map(x => `<span class="mono">${esc(x.artifact_id)}</span> (${termHtml(HUMAN_SEL_REASON, x.reason)})`).join(", ")}` : ""}</li>` : "";
      const boxes = f.containerProvenance || [];
      const boxesHtml = (zeroRowImgs.length || boxes.length) ? `
        <details class="raw-json" style="margin:10px 0 0">
          <summary>Container provenance (${zeroRowImgs.length + boxes.length} header-only PNG container${zeroRowImgs.length + boxes.length === 1 ? "" : "s"}: 0 pixel rows, not output images)</summary>
          <ul class="group-facts" style="margin:6px 0 2px">
            ${zeroRowImgs.map(im => `<li><span class="mono">${esc(im.id)}</span>: ${esc(im.rows || im.completeness)} decoded · <span class="mono">${esc(locationText(im))}</span> · ${linkHtml(f, im)}</li>`).join("")}
            ${boxes.map(c => `<li><span class="mono">${esc(c.artifactId)}</span>: ${esc(c.rows)} decoded, from ${esc(c.fromFinding)}${c.linkIds.length ? ` via <span class="mono">${esc(c.linkIds.join(", "))}</span>` : ""}</li>`).join("")}
          </ul>
        </details>` : "";
      /* Every replay result shown beside an image is that image's own: an untested sibling says "not compared". */
      const testedHere = r && r.scope === "TESTED" && (!activeCopy || activeCopy.id === r.testedArtifact);
      const scopedResult = !r ? "" : testedHere ? r.comparisonStatus
        : activeCopy ? `not compared with ${activeCopy.id}` : r.comparisonStatus;
      const ssimText = r && r.ssim ? " · SSIM " + esc(r.ssim) : "";
      let replayPill = "";
      if (r) {
        const raw = esc(r.comparisonStatus);
        if (testedHere || (isRaw && !activeCopy)) {
          replayPill = r.match
            ? `<span class="status-pill status-ok" title="${raw}">${esc(humanStatus(r.comparisonStatus))}${ssimText}</span>`
            : `<span class="status-pill ${r.comparisonStatus === "NON_MATCHING" ? "status-warn" : "status-neutral"}" title="${raw}">${esc(humanStatus(r.comparisonStatus))}${ssimText}</span>`;
        } else if (r.scope === "NO_TARGET" || r.comparisonStatus === "NO_MEMORY_TARGET") {
          replayPill = `<span class="status-pill status-neutral" title="${raw}">${esc(humanStatus("NO_MEMORY_TARGET"))}</span>`;
        } else if (activeCopy) {
          replayPill = `<span class="status-pill status-warn" title="The replay compared ${esc(r.testedArtifact || "another artifact")}">Not compared with ${esc(activeCopy.id)}</span>`;
        } else {
          replayPill = `<span class="status-pill status-neutral" title="${raw}">Not compared (replay tested ${esc(r.testedArtifact || "another artifact")})</span>`;
        }
      }
      const compareHeadHtml = r ? `
        <div class="compare-head">
          <div class="compare-head-top">
            <strong>${isRaw ? "Raw whole-frame match" : "Lab replay"} <span class="mono">${esc(r.id)}</span></strong>
            ${replayPill}
            ${r.rows ? `<span class="chip mono" title="Rows compared">${esc(r.rows)}</span>` : ""}
            ${r.promoted ? `<span class="status-pill status-ok">tier raised</span>` : ""}
          </div>
          <details class="raw-json" style="margin:0;border:none;background:transparent">
            <summary style="padding:2px 0;font-size:11px;color:var(--ink-muted)">Replay details${r.recordedVerdict ? ` (recorded verdict ${esc(r.recordedVerdict)})` : ""}</summary>
            <ul class="group-facts" style="margin:4px 0 0">
              <li><strong>Execution:</strong> ${esc(r.execution)}</li>
              <li><strong>Comparison:</strong> ${esc(r.summary)} <span class="mono" style="color:var(--ink-muted)">[${esc(r.comparisonStatus)}]</span></li>
              <li><strong>Promotion:</strong> ${esc(r.promotion)}</li>
              ${selectionHtml}
              ${(r.others || []).map(o => `<li><strong>${esc(o.id)}${o.observation === "RAW_WHOLE_FRAME" ? " (raw whole frame)" : ""}:</strong> ${esc(o.summary)}; ${esc(o.promotion)}</li>`).join("")}
            </ul>
          </details>
        </div>
      ` : "";

      /* Both replay hashes on their own lines: the regenerated pixels, and the derived PNG file on disk. */
      const replayHashes = r ? `
                <div class="hash-rows">
                  ${hashRow("Pixel SHA-256", r.derivedPixelSha256, 16, "unavailable (replay image not verified)",
                    r.derivedPixelSha256 && activeCopy && r.derivedPixelSha256 === activeCopy.pixelSha256 ? `<span class="same-badge">✓ identical to recovered pixels</span>` : "")}
                  ${hashRow("Derived file SHA-256", r.derivedFileSha256, 16, "not recorded")}
                </div>` : "";
      const recoveredHash = im => hashRow("Decoded pixels SHA-256", im.pixelSha256, 16,
        im.completeness === "COMPLETE" ? "not recorded" : "unavailable (partial image)");
      const artOpts = im => ({ partialPct: im.partialPct, rowsLabel: im.rows, size: im.size, omitted: im.omitted, alt: im.id });

      let stageHtml = "";
      if (activeCopy && r) {
        /* Side-by-side Recovered vs Replayed. The comparison is the tested artifact's only. */
        stageHtml = `
          <div class="image-stage side-by-side">
            <div class="image-pane">
              <div class="image-pane-head">
                <strong>Recovered from RAM · <span class="mono">${esc(activeCopy.id)}</span></strong>
                <span class="mono" style="color:var(--ink-muted)">${esc(activeCopy.size)}</span>
              </div>
              <div class="image-frame">
                ${makeArtSVG(activeCopy.uri, artOpts(activeCopy))}
              </div>
              ${activeCopy.previewNote ? `<p class="status-warn" style="margin:0;padding:4px 10px">${esc(activeCopy.previewNote)}</p>` : ""}
              <div class="image-pane-foot">
                <span>${esc(activeCopy.kind)} (${esc(activeCopy.rows || activeCopy.completeness.toLowerCase())})</span>
                ${recoveredHash(activeCopy)}
              </div>
            </div>
            <div class="image-pane">
              <div class="image-pane-head">
                <strong>Lab replay of <span class="mono">${esc(r.workflowId)}</span> · <span class="mono">${esc(r.id)}</span></strong>
                <span class="replay-badge" title="Regenerated offline from the recovered workflow; never found in memory">↻ LAB REPLAY</span>
              </div>
              <div class="image-frame">
                ${makeArtSVG(r.uri, { omitted: r.omitted, alt: r.id })}
              </div>
              <div class="image-pane-foot">
                <span title="${esc(scopedResult)}">${esc(humanStatus(scopedResult))}${r.exact && testedHere ? " · identical pixels" : ""}</span>
                ${replayHashes}
              </div>
            </div>
          </div>
        `;
      } else if (!activeCopy && r) {
        /* E4 or a raw-frame match: no drawable memory image beside the replayed image. */
        const zeroNote = zeroRowImgs.length
          ? `<strong style="display:block;color:var(--ink);margin-bottom:4px;">0 pixel rows recovered in RAM</strong>
                  ${zeroRowImgs.length} torn PNG header${zeroRowImgs.length === 1 ? "" : "s"} only (they carry the prompt, not the picture); see container provenance below.`
          : `<strong style="display:block;color:var(--ink);margin-bottom:4px;">No image recovered in memory</strong>
                  No copy of this job's output was found in the memory image.`;
        stageHtml = `
          <div class="image-stage side-by-side">
            <div class="image-pane">
              <div class="image-pane-head">
                <strong>${isRaw ? "Recovered frame (no preview)" : "Recovered from RAM"}</strong>
                <span class="mono" style="color:var(--ink-muted)">${isRaw ? "raw dump · packed pixels" : (zeroRowImgs.length ? "header only" : "none")}</span>
              </div>
              <div class="image-frame" style="padding:20px;text-align:center;">
                <div style="color:var(--ink-muted);font-size:12px;">
                  ${isRaw && r.rawFrame ? `
                  <strong style="display:block;color:var(--ink);margin-bottom:4px;">Raw memory frame (packed pixels, no preview)</strong>
                  <span class="mono">${esc(r.rawFrame.raw_file)}</span><br>raw SHA-256 <span class="mono">${esc(shortHash(r.rawFrame.raw_sha256, 16))}</span>` : zeroNote}
                </div>
              </div>
              <div class="image-pane-foot">${isRaw ? `<span>Whole frame in the raw dump</span><span title="${esc(r.comparisonStatus)}">${esc(humanStatus(r.comparisonStatus))}</span>` : `<span>${zeroRowImgs.length ? "No pixels to compare with the replay" : "Memory image absent"}</span>`}</div>
            </div>
            <div class="image-pane">
              <div class="image-pane-head">
                <strong>Replayed output · <span class="mono">${esc(r.id)}</span></strong>
                <span class="replay-badge" title="Regenerated offline from the recovered workflow; never found in memory">↻ LAB REPLAY</span>
              </div>
              <div class="image-frame">
                ${makeArtSVG(r.uri, { omitted: r.omitted, alt: r.id })}
              </div>
              <div class="image-pane-foot">
                <span>Generated offline from ${esc(r.workflowId)}</span>
                ${replayHashes}
              </div>
            </div>
          </div>
        `;
      } else if (activeCopy) {
        /* Single recovered image view */
        stageHtml = `
          <div class="image-stage">
            <div class="image-pane">
              <div class="image-pane-head">
                <div>
                  <strong>${esc(activeCopy.id)}</strong> · ${esc(activeCopy.kind)}
                  ${activeCopy.derived ? `<span class="derived-badge" style="margin-left:6px">◈ DERIVED</span>` : ""}
                </div>
                <span class="mono" style="color:var(--ink-muted)">${esc(activeCopy.size)} · ${esc(activeCopy.rows || activeCopy.completeness.toLowerCase())}</span>
              </div>
              <div class="image-frame">
                ${makeArtSVG(activeCopy.uri, artOpts(activeCopy))}
              </div>
              ${activeCopy.previewNote ? `<p class="status-warn" style="margin:0;padding:4px 10px">${esc(activeCopy.previewNote)}</p>` : ""}
              <div class="image-pane-foot">
                ${recoveredHash(activeCopy)}
              </div>
            </div>
          </div>
        `;
      } else {
        stageHtml = `
          <div class="note-callout" style="margin-top:0">
            <strong>0 pixel rows recovered in RAM.</strong> ${zeroRowImgs.length} torn PNG header${zeroRowImgs.length === 1 ? "" : "s"} only: they carry the prompt, not the picture.
          </div>`;
      }

      const artifactMetaHtml = activeCopy ? `
        <div class="artifact-caption">
          <span><span class="k">Found</span>${esc(activeCopy.source)}</span>
          <span><span class="k">At</span><span class="mono">${esc(locationText(activeCopy))}</span></span>
          <span><span class="k">Link</span>${linkHtml(f, activeCopy)}</span>
          ${hashRow("Recovered file SHA-256", activeCopy.containerSha256, 20, "unavailable (incomplete stream or raw tensor)")}
        </div>
        ${activeCopy.derived ? `<div class="derived-callout"><strong>◈ Derived reconstruction.</strong> ${esc(activeCopy.derivedNote || "Reconstructed from recovered data, not recovered as-is.")}</div>` : ""}
      ` : "";

      const countChip = [
        imgs.length ? `${imgs.length} recovered image${imgs.length === 1 ? "" : "s"}` : "no drawable image",
        zeroRowImgs.length ? `${zeroRowImgs.length} header-only` : "",
        r ? "lab replay" : ""
      ].filter(Boolean).join(" + ");
      imageCardHtml = `
        <section class="card">
          <div class="card-header">
            <div class="card-title">
              <span>Image Evidence</span>
              <span class="chip mono">${esc(countChip)}</span>
            </div>
            ${activeCopy && activeCopy.file ? `<button class="btn btn-sm" id="inlineExpImgBtn" title="Open the recovered bytes of ${esc(activeCopy.id)} from the case folder">Export image file</button>` : ""}
          </div>
          <div class="card-body">
            ${thumbsHtml}
            ${compareHeadHtml}
            ${stageHtml}
            ${artifactMetaHtml}
            ${boxesHtml}
          </div>
        </section>
      `;
    }

    /* 3. Workflow Section (SVG node graph + key parameters, side by side on wide screens) */
    let wfCardHtml = "";
    if (f.workflow) {
      const wf = f.workflow;
      const p = wf.params;
      const hasGraph = Object.keys(wf.graph || {}).length > 0;
      const { svg, selNode } = hasGraph ? renderWorkflowSVG(wf) : { svg: "", selNode: null };
      const apiJson = hasGraph ? JSON.stringify(wf.graph, null, 2) : "";
      const activeWfCopy = state.selectedWfCopyIdx !== null ? wf.copies[state.selectedWfCopyIdx] : null;
      const val = v => present(v) ? esc(v) : `<span style="color:var(--ink-muted)">not recovered</span>`;
      const joined = (parts) => { const got = parts.filter(([v]) => present(v)).map(([v, fmt]) => fmt(v)); return got.length ? esc(got.join(" · ")) : val(DASH); };
      const stepsCfg = joined([[p.steps, v => `${v} steps`], [p.cfg, v => `CFG ${v}`]]);
      const sampler = joined([[p.sampler, v => v], [p.scheduler, v => v]]);
      const resolution = present(p.width) && present(p.height) ? esc(`${p.width}×${p.height}`) : val(DASH);
      const promptBox = (label, text) => `
                <div class="prompt-box">
                  <div class="prompt-head">
                    <span>${label}</span>
                    ${present(text) ? `<button class="copy-btn" data-copy="${esc(text)}">Copy</button>` : ""}
                  </div>
                  <p class="prompt-text">${val(text)}</p>
                </div>`;
      const sameGraph = wf.copies.length > 0 && wf.copies.every(c => c.sha256 === wf.sha256);
      const shownCopies = state.showAllWfCopies ? wf.copies : wf.copies.slice(0, WF_COPIES_SHOWN);
      const copiesHtml = wf.copies.length ? `
            <div class="wf-copies-bar">
              <span style="font-size:11.5px;color:var(--ink-muted)" title="${sameGraph ? "Records with the same canonical graph hash as the lead record" : "Other workflow records in this finding; their graph hashes differ from the lead record"}">${sameGraph ? "Byte-distinct copies of this graph" : "Other workflow records in this finding"} (${wf.copies.length}):</span>
              <div class="copy-pills">
                ${shownCopies.map((c, i) => `
                  <button class="wf-copy-pill ${state.selectedWfCopyIdx === i ? "active" : ""}" data-wfcopy="${i}" title="${esc(c.source)}" aria-pressed="${state.selectedWfCopyIdx === i}">
                    ${esc(c.id)}
                  </button>
                `).join("")}
                ${wf.copies.length > WF_COPIES_SHOWN ? `<button class="link-btn" data-wfcopies-toggle="1" style="font-size:11px">${state.showAllWfCopies ? "Show fewer" : `Show all ${wf.copies.length} records`}</button>` : ""}
              </div>
            </div>
            <div class="wf-copy-detail ${activeWfCopy ? "open" : ""}">
              ${activeWfCopy ? `<strong>${esc(activeWfCopy.id)}</strong> — ${esc(activeWfCopy.source)} · SHA-256 <span class="mono">${esc(activeWfCopy.sha256)}</span>` : ""}
            </div>` : "";

      wfCardHtml = `
        <section class="card">
          <div class="card-header">
            <div class="card-title">
              <span>Workflow</span>
              <span class="chip mono">${esc(wf.id)} · ${esc(wf.format)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-size:11.5px;color:var(--ink-muted)">${esc(capitalize(wf.source))}</span>
              ${hasGraph ? `<button class="btn btn-sm" id="inlineExpWfBtn">Export API JSON</button>` : ""}
            </div>
          </div>
          <div class="card-body">
            <div class="workflow-layout ${hasGraph ? "has-graph" : ""}">
              ${hasGraph ? `
              <div class="graph-panel">
                <div class="graph-bar">
                  <span>Node graph (${Object.keys(wf.graph).length} nodes)</span>
                  <span>Click or press Enter on a node to inspect it</span>
                </div>
                <div class="graph-svg-wrap">${svg}</div>
                <div class="node-inspector" aria-live="polite">
                  <div class="node-inspector-title">Node #${esc(selNode.id)} · ${esc(selNode.title)}</div>
                  <div class="node-inspector-kv">${esc(selNode.detail)}</div>
                </div>
              </div>` : ""}

              <div class="params-panel">
                ${hasGraph ? "" : `<div class="note-callout" style="margin-top:0">No verified API graph to draw for this ${esc(wf.format)} record; the parameters below are what was recovered.</div>`}
                <table class="param-table">
                  <tr><th>Checkpoint</th><td class="mono">${val(p.checkpoint)}</td></tr>
                  <tr><th>Seed</th><td class="mono">${val(p.seed)}</td></tr>
                  <tr><th>Steps / CFG</th><td class="mono">${stepsCfg}</td></tr>
                  <tr><th>Sampler</th><td class="mono">${sampler}</td></tr>
                  <tr><th>Resolution</th><td class="mono">${resolution}</td></tr>
                </table>
                ${promptBox("Positive prompt", p.positive)}
                ${promptBox("Negative prompt", p.negative)}
              </div>
            </div>
            ${copiesHtml}
            ${hasGraph ? `
            <details class="raw-json">
              <summary>Inspect raw API graph JSON (${esc(wf.id)})</summary>
              <pre>${esc(apiJson)}</pre>
            </details>` : ""}
          </div>
        </section>
      `;
    }

    /* 4. Workflow group: only when several findings share the graph or a seed cross-reference points here. */
    let groupCardHtml = "";
    const grp = shownGroup(f);
    if (grp) {
      const childRows = grp.children.map(c => {
        const full = BY_ID[c.id];
        const ims = (full && full.images) || [];
        const artRows = ims.length ? ims : [null];
        return artRows.map((im, i) => {
          const cmp = im && im.comparison;
          const cmpLabel = (c.comparisons || {})[im ? im.id : ""] || "not compared";
          const cmpBadge = !im ? "—"
            : cmp ? `<span class="cmp-tag ${cmpClass(cmp.status)}" title="${esc(cmp.status + ": " + cmp.label)}">${esc(humanStatus(cmp.status).toLowerCase())}</span>`
            : `<span class="cmp-tag" title="${esc(cmpLabel)}">not compared</span>`;
          return `
          <tr class="${c.id === f.id ? "current" : ""}">
            ${i === 0 ? `<td rowspan="${artRows.length}"><button class="link-btn" data-select="${esc(c.id)}">${esc(c.id)}</button></td>
                         <td rowspan="${artRows.length}"><span class="tier-badge t-${esc(c.tier)}">${esc(c.tier)}</span></td>` : ""}
            <td class="mono">${im ? esc(im.id) : "—"}</td>
            <td class="mono">${im ? esc(im.rows || im.completeness.toLowerCase()) : "—"}</td>
            <td>${cmpBadge}</td>
          </tr>`;
        }).join("");
      }).join("");
      const subChip = grp.submissions.promptIds.length
        ? `<span class="chip mono" title="${esc(grp.submissions.note)}">Prompt IDs: ${esc(grp.submissions.promptIds.join(", "))}</span>`
        : `<span class="chip" title="${esc(grp.submissions.note)}">Unbound copies</span>`;
      const replayChips = grp.replays.length
        ? grp.replays.map(rp => `<span class="cmp-tag ${cmpClass(rp.comparisonStatus)}" title="${esc(rp.comparisonStatus + ": " + rp.comparison)}">${esc(rp.id)} · ${esc(humanStatus(rp.comparisonStatus).toLowerCase())}</span>`).join(" ")
        : `<span class="chip">No lab replay</span>`;
      const xrefChips = grp.seedXrefs.length
        ? grp.seedXrefs.map(x => `<button class="link-btn" data-select="${esc(x.findingId)}" title="${esc(x.note)}" style="font-size:11px">Seed match: ${esc(x.findingId)} (${esc(x.tier)})</button>`).join(" ")
        : "";
      groupCardHtml = `
        <section class="card">
          <div class="card-header">
            <div class="card-title">
              <span>Workflow group</span>
              <span class="chip mono" title="${esc(grp.digest)}">${esc(grp.leadWorkflowId || "—")}</span>
              ${subChip}
              ${replayChips}
            </div>
            <span style="font-size:11.5px;color:var(--ink-muted)">${grp.children.length} finding${grp.children.length === 1 ? "" : "s"} · ${grp.copies.length} graph cop${grp.copies.length === 1 ? "y" : "ies"}</span>
          </div>
          <div class="card-body">
            ${xrefChips ? `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:11.5px;color:var(--ink-muted)"><span>Related E6 fragments:</span> ${xrefChips}</div>` : ""}
            <table class="group-table">
              <thead><tr><th>Finding</th><th>Tier</th><th>Artifact</th><th>Coverage</th><th>Replay</th></tr></thead>
              <tbody>${childRows}</tbody>
            </table>
            ${grp.replays.length ? `
            <details class="raw-json" style="margin-top:8px">
              <summary>Replay &amp; audit details (${grp.replays.length})</summary>
              <ul class="group-facts" style="margin:6px 0 2px">${grp.replays.map(rp => `
                <li><strong class="mono">${esc(rp.id)}</strong>${rp.observation === "RAW_WHOLE_FRAME" ? " (raw whole-frame match)" : ""}: ${esc(rp.execution)}.
                  Tested: ${rp.testedArtifact ? `<span class="mono">${esc(rp.testedArtifact)}</span>${rp.testedFinding ? ` (${esc(rp.testedFinding)})` : ""}` : "none"} · <span class="cmp-tag ${cmpClass(rp.comparisonStatus)}" title="${esc(rp.comparisonStatus)}">${esc(humanStatus(rp.comparisonStatus))}</span>${rp.recordedVerdict ? ` (recorded verdict ${esc(rp.recordedVerdict)})` : ""} ${esc(rp.comparison)}.
                  ${rp.appliedTo ? `This observation applied to ${esc(rp.appliedTo)}.` : "This observation applied to no finding."}</li>`).join("")}</ul>
            </details>` : ""}
          </div>
        </section>
      `;
    }

    centreInnerEl.innerHTML = heroHtml + imageCardHtml + wfCardHtml + groupCardHtml;

    /* Update export menu states */
    expImageEl.disabled = !activeCopy;
    expImageSubEl.textContent = activeCopy ? `Download ${activeCopy.id} (${activeCopy.kind})` : "No recovered image on this finding";
    const hasWfGraph = Object.keys(f.workflow?.graph || {}).length > 0;
    expWorkflowEl.disabled = !hasWfGraph;
    expWorkflowSubEl.textContent = hasWfGraph ? `Download ${f.workflow.id} API graph JSON`
      : (f.workflow ? "No verified API graph available" : "No workflow linked");
  }

  /* Render Right Panel: Top-to-Bottom Provenance Chain */
  function renderProvenance(f) {
    if (!f) {
      provContainerEl.innerHTML = `<div class="empty-state">No finding selected.</div>`;
      return;
    }

    const imgs = visualImages(f);
    const zeroRowImgs = (f.images || []).filter(im => im.container);
    const activeCopy = imgs[state.selectedCopyIdx] || null;
    const modeText = human(HUMAN_MODE, CASE_META.mode);
    const lines = (...xs) => xs.filter(Boolean).join("\n");
    provCopyTagEl.textContent = activeCopy ? `${f.id} · ${activeCopy.id}` : f.id;

    /* 2. Where the evidence was read: the image's location, else the workflow record's origin. */
    let step2;
    if (activeCopy) {
      const loc = locationText(activeCopy);
      step2 = { state: "verified", id: loc, hashes: [], fullCopy: loc, sub: activeCopy.source };
    } else if (f.workflow) {
      step2 = {
        state: "verified",
        id: capitalize(f.workflow.source),
        hashes: [CASE_META.mode === "PHYSICAL_FALLBACK" ? "Physical page scan" : "Recovered workflow record"],
        fullCopy: `${f.workflow.id}: ${f.workflow.source}`,
        sub: modeText
      };
    } else {
      step2 = { state: "absent", id: "No memory source", hashes: [], fullCopy: "No memory source", sub: "" };
    }

    /* 3. The image artifact and its hashes; a missing hash says why, never "null". */
    let step3;
    if (activeCopy) {
      const partial = activeCopy.completeness !== "COMPLETE";
      step3 = {
        state: activeCopy.derived ? "derived" : "verified",
        id: `${activeCopy.id} (${activeCopy.rows || activeCopy.completeness.toLowerCase()})`,
        hashes: [
          activeCopy.pixelSha256 ? "Pixels " + shortHash(activeCopy.pixelSha256, 20)
            : (partial ? "Partial stream (no whole-image pixel hash)" : "No pixel hash recorded"),
          activeCopy.containerSha256 ? "File " + shortHash(activeCopy.containerSha256, 20) : ""
        ].filter(Boolean),
        fullCopy: lines(activeCopy.id,
          activeCopy.pixelSha256 && `Pixel SHA-256: ${activeCopy.pixelSha256}`,
          activeCopy.containerSha256 && `Container SHA-256: ${activeCopy.containerSha256}`),
        sub: [activeCopy.kind, present(activeCopy.size) ? activeCopy.size : "", activeCopy.derived ? "DERIVED" : ""].filter(Boolean).join(" · ")
      };
    } else if (zeroRowImgs.length) {
      step3 = {
        state: "absent",
        id: `${zeroRowImgs.length} header-only PNG container${zeroRowImgs.length === 1 ? "" : "s"}`,
        hashes: [],
        fullCopy: zeroRowImgs.map(im => `${im.id} (${im.rows || im.completeness})`).join("\n"),
        sub: "0 pixel rows recovered in RAM"
      };
    } else {
      step3 = { state: "absent", id: "No image artifact", hashes: [], fullCopy: "No image artifact", sub: "Not recovered in RAM" };
    }

    /* 4. The link: verified only for a metadata-key link, never for an unlinked or ambiguous image. */
    let step4;
    if (activeCopy) {
      const linked = !["AMBIGUOUS", "UNASSOCIATED", "NONE", DASH].includes(activeCopy.link);
      const byComparison = linkedByComparison(f, activeCopy);
      step4 = {
        state: linked ? "verified" : byComparison ? "derived" : "absent",
        id: linked ? `${human(HUMAN_LINK, activeCopy.link)}${present(activeCopy.key) ? " · " + humanKeys(activeCopy.key) : ""}`
          : human(HUMAN_LINK, activeCopy.link),
        hashes: present(activeCopy.linkDigest) ? [activeCopy.linkDigest] : [],
        fullCopy: [activeCopy.link, present(activeCopy.key) ? activeCopy.key : "", present(activeCopy.linkDigest) ? activeCopy.linkDigest : ""].filter(Boolean).join(" "),
        sub: linked ? "A metadata key binds this image to the workflow"
          : byComparison ? "No metadata key link; tied to the job by image comparison (see rationale)"
          : activeCopy.link === "AMBIGUOUS" ? "Several workflows could match this image" : "No metadata key link"
      };
    } else {
      step4 = { state: "absent", id: "Unlinked", hashes: [], fullCopy: "No image-to-workflow link", sub: "No image-to-workflow link" };
    }

    const wf = f.workflow;
    const job = f.job || {};
    const hasJob = [job.promptId, job.queued, job.status].some(present);
    const r = f.replay;
    const steps = [
      {
        role: "1. Dump",
        state: "verified",
        id: CASE_META.dumpName,
        hashes: ["SHA-256 " + shortHash(CASE_META.dumpSha256, 20)],
        fullCopy: `${CASE_META.dumpName}\nSHA-256: ${CASE_META.dumpSha256}`,
        sub: `${CASE_META.dumpSize} · ${modeText}`,
        subTitle: CASE_META.mode
      },
      { role: "2. Process / Page", ...step2 },
      { role: "3. Artifact", ...step3 },
      { role: "4. Link Key", ...step4 },
      {
        role: "5. Workflow",
        state: wf ? "verified" : "absent",
        id: wf ? `${wf.id} (${wf.format})` : "No workflow",
        hashes: wf ? ["SHA-256 " + shortHash(wf.sha256, 20)] : [],
        fullCopy: wf ? `${wf.id}\nSHA-256: ${wf.sha256}` : "No workflow",
        sub: wf ? [present(wf.params.seed) ? `Seed ${wf.params.seed}` : "",
                   wf.copies.length ? `${wf.copies.length} other record${wf.copies.length === 1 ? "" : "s"}` : ""].filter(Boolean).join(" · ") : "None"
      },
      {
        role: "6. Job",
        state: job.status === "success" ? "verified" : "absent",
        id: present(job.promptId) ? job.promptId : "No job record recovered",
        hashes: present(job.queued) ? [`Queued ${job.queued}${present(job.duration) ? ` · ran ${job.duration}` : ""}`] : [],
        fullCopy: hasJob ? lines(present(job.promptId) && `Prompt ID: ${job.promptId}`, present(job.queued) && `Queued: ${job.queued}`,
          present(job.duration) && `Duration: ${job.duration}`, present(job.status) && `Status: ${job.status}`) : "No job record recovered",
        sub: present(job.status) ? `Status: ${job.status}` : (hasJob ? "" : "No prompt ID, queue time or outcome in memory")
      },
      {
        role: "7. Lab replay",
        state: r ? (r.exact ? "verified" : "derived") : "absent",
        id: r ? `${r.id} · ${humanStatus(r.comparisonStatus)}` : "Not replayed",
        hashes: r ? [
          "Pixel SHA-256 " + (r.derivedPixelSha256 ? shortHash(r.derivedPixelSha256, 16) : "unavailable"),
          "Derived file SHA-256 " + shortHash(r.derivedFileSha256, 16)
        ] : [],
        fullCopy: r ? lines(r.id, `Execution: ${r.execution}`, `Comparison: ${r.summary} [${r.comparisonStatus}]`, `Promotion: ${r.promotion}`,
          r.derivedPixelSha256 && `Pixel SHA-256: ${r.derivedPixelSha256}`, `Derived file SHA-256: ${r.derivedFileSha256}`) : "Not replayed",
        sub: r ? `${r.summary} · ${r.promotion}` : "No verified lab replay of this workflow"
      }
    ];

    provContainerEl.innerHTML = `
      <div class="chain">
        ${steps.map(s => `
          <div class="chain-step ${s.state}">
            <span class="chain-dot" aria-hidden="true"></span>
            <div class="chain-card">
              <div class="chain-top">
                <span class="chain-role">${esc(s.role)}</span>
                <button class="copy-btn" data-copy="${esc(s.fullCopy)}" title="Copy ID and hash">Copy</button>
              </div>
              <div class="chain-id">${esc(s.id)}</div>
              ${(s.hashes || []).map(h => `<div class="chain-hash" title="${esc(s.fullCopy)}">${esc(h)}</div>`).join("")}
              ${s.sub ? `<div class="chain-sub"${s.subTitle ? ` title="${esc(s.subTitle)}"` : ""}>${esc(s.sub)}</div>` : ""}
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }

  /* Master Render */
  function render() {
    const list = getFilteredFindings();
    const active = getActiveFinding(list);
    renderTierStack();
    renderFindingList(list, active);
    renderCentre(list, active);
    renderProvenance(active);
    searchClearEl.classList.toggle("visible", state.search.length > 0);
  }

  /* Navigation Helpers */
  function selectFinding(id) {
    state.selectedId = id;
    state.selectedCopyIdx = 0;
    state.selectedWfCopyIdx = null;
    state.showAllWfCopies = false;
    render();
  }

  /* Opens a finding named inside the centre (a group's child or cross-reference), clearing filters that hide it. */
  function jumpTo(id) {
    const f = BY_ID[id];
    if (!f) { showToast(id + " is not listed on this page; see manifest.json"); return; }
    if (f.tier === "UT") state.showUntiered = true;
    if (!getFilteredFindings().some(x => x.id === id)) {
      state.tierFilter = "ALL";
      state.search = "";
      searchInputEl.value = "";
    }
    selectFinding(id);
  }

  function stepFinding(delta) {
    const list = getFilteredFindings();
    if (list.length === 0) return;
    const idx = list.findIndex(x => x.id === state.selectedId);
    const next = Math.max(0, Math.min(list.length - 1, idx + delta));
    if (next !== idx) {
      selectFinding(list[next].id);
    }
  }

  function setTierFilter(tier) {
    state.tierFilter = (state.tierFilter === tier && tier !== "ALL") ? "ALL" : tier;
    if (state.tierFilter === "UT") state.showUntiered = true;
    state.selectedCopyIdx = 0;
    state.selectedWfCopyIdx = null;
    const list = getFilteredFindings();
    if (list.length > 0 && !list.some(x => x.id === state.selectedId)) {
      state.selectedId = list[0].id;
    }
    render();
  }

  /* Export Handlers */
  function exportCurrentImage() {
    const f = getActiveFinding(getFilteredFindings());
    const im = visualImages(f)[state.selectedCopyIdx];
    if (!im) return;
    if (!im.file) { showToast("No exported file is recorded for " + im.id); return; }
    /* The raw bytes stay in the case folder; this links to them (relative to this report) rather than copying. */
    const a = document.createElement("a");
    a.href = im.file;
    a.download = im.file.split("/").pop();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast("Opening " + im.file);
  }

  function exportCurrentWorkflow() {
    const f = getActiveFinding(getFilteredFindings());
    if (!Object.keys(f?.workflow?.graph || {}).length) return;
    const payload = JSON.stringify(buildApiWorkflowJson(f.workflow), null, 2);
    downloadBlob(`${f.id}_${f.workflow.id}.json`, payload, "application/json");
  }

  function exportCurrentBundle() {
    const f = getActiveFinding(getFilteredFindings());
    if (!f) return;
    const bundle = {
      schema: "comfytrace.evidence_bundle.v1",
      generatedBy: `${CASE_META.tool} ${CASE_META.version}`,
      caseDump: {
        filename: CASE_META.dumpName,
        size: CASE_META.dumpSize,
        sha256: CASE_META.dumpSha256,
        mode: CASE_META.mode
      },
      finding: {
        id: f.id,
        tier: f.tier,
        baseTier: f.baseTier,
        tierLabel: f.tierLabel || TIERS[f.tier].short,
        rationale: f.rationale,
        job: f.job,
        images: f.images,
        workflow: f.workflow ? { ...f.workflow, apiGraph: buildApiWorkflowJson(f.workflow) } : null,
        workflowGroup: (f.groupId && GROUPS[f.groupId]) || null,
        replay: f.replay
      }
    };
    downloadBlob(`${f.id}_evidence_bundle.json`, JSON.stringify(bundle, null, 2), "application/json");
  }

  /* Event Delegation */
  tierStackEl.addEventListener("click", e => {
    if (e.target.closest(".untiered-toggle")) {
      state.showUntiered = !state.showUntiered;
      if (!state.showUntiered && state.tierFilter === "UT") {
        state.tierFilter = "ALL";
      }
      render();
      showToast(state.showUntiered ? "Untiered findings included in the list" : "Untiered findings hidden");
      return;
    }
    const btn = e.target.closest(".tier-filter");
    if (!btn) return;
    setTierFilter(btn.dataset.tier);
  });

  searchInputEl.addEventListener("input", () => {
    state.search = searchInputEl.value;
    render();
  });

  searchClearEl.addEventListener("click", () => {
    state.search = "";
    searchInputEl.value = "";
    render();
    searchInputEl.focus();
  });

  findingListEl.addEventListener("click", e => {
    const row = e.target.closest(".finding-row");
    if (!row) return;
    selectFinding(row.dataset.id);
  });

  function selectNode(id, refocus) {
    state.selectedNodeId = id;
    render();
    if (refocus) {
      const again = Array.from(centreInnerEl.querySelectorAll(".wf-node")).find(n => n.dataset.node === id);
      if (again) again.focus();
    }
  }

  centreInnerEl.addEventListener("click", e => {
    const prevBtn = e.target.closest("#prevFindingBtn");
    if (prevBtn) { stepFinding(-1); return; }

    const nextBtn = e.target.closest("#nextFindingBtn");
    if (nextBtn) { stepFinding(1); return; }

    const jump = e.target.closest("[data-select]");
    if (jump) { jumpTo(jump.dataset.select); return; }

    const copyCard = e.target.closest(".copy-card");
    if (copyCard) {
      state.selectedCopyIdx = Number(copyCard.dataset.copyIdx);
      render();
      return;
    }

    const wfNode = e.target.closest(".wf-node");
    if (wfNode) { selectNode(wfNode.dataset.node, false); return; }

    const wfCopy = e.target.closest(".wf-copy-pill");
    if (wfCopy) {
      const idx = Number(wfCopy.dataset.wfcopy);
      state.selectedWfCopyIdx = state.selectedWfCopyIdx === idx ? null : idx;
      render();
      return;
    }

    if (e.target.closest("[data-wfcopies-toggle]")) {
      state.showAllWfCopies = !state.showAllWfCopies;
      if (!state.showAllWfCopies && state.selectedWfCopyIdx !== null && state.selectedWfCopyIdx >= WF_COPIES_SHOWN) {
        state.selectedWfCopyIdx = null;
      }
      render();
      return;
    }

    const copyBtn = e.target.closest(".copy-btn");
    if (copyBtn) {
      copyText(copyBtn.dataset.copy, copyBtn);
      return;
    }

    if (e.target.closest("#inlineExpImgBtn")) { exportCurrentImage(); return; }
    if (e.target.closest("#inlineExpWfBtn")) { exportCurrentWorkflow(); return; }
  });

  /* Keyboard: Enter or Space on a focused graph node inspects it, as a click does. */
  centreInnerEl.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const wfNode = e.target.closest && e.target.closest(".wf-node");
    if (!wfNode) return;
    e.preventDefault();
    e.stopPropagation();
    selectNode(wfNode.dataset.node, true);
  });

  provContainerEl.addEventListener("click", e => {
    const copyBtn = e.target.closest(".copy-btn");
    if (copyBtn) copyText(copyBtn.dataset.copy, copyBtn);
  });

  /* Export Dropdown */
  exportToggleEl.addEventListener("click", e => {
    e.stopPropagation();
    const isOpen = exportMenuEl.classList.toggle("open");
    exportToggleEl.setAttribute("aria-expanded", String(isOpen));
  });

  /* Keyboard shortcuts popover */
  function toggleKbd(open) {
    const isOpen = open ?? !kbdPopEl.classList.contains("open");
    kbdPopEl.classList.toggle("open", isOpen);
    kbdBtnEl.setAttribute("aria-expanded", String(isOpen));
  }
  kbdBtnEl.addEventListener("click", e => { e.stopPropagation(); toggleKbd(); });

  document.addEventListener("click", e => {
    if (!e.target.closest("#exportDropdown")) {
      exportMenuEl.classList.remove("open");
      exportToggleEl.setAttribute("aria-expanded", "false");
    }
    if (!e.target.closest("#kbdWrap")) toggleKbd(false);
  });

  expImageEl.addEventListener("click", () => { exportMenuEl.classList.remove("open"); exportCurrentImage(); });
  expWorkflowEl.addEventListener("click", () => { exportMenuEl.classList.remove("open"); exportCurrentWorkflow(); });
  expBundleEl.addEventListener("click", () => { exportMenuEl.classList.remove("open"); exportCurrentBundle(); });
  expPrintEl.addEventListener("click", () => { exportMenuEl.classList.remove("open"); window.print(); });

  /* Theme Cycle (Auto -> Light -> Dark) */
  themeBtnEl.addEventListener("click", () => {
    const order = ["auto", "light", "dark"];
    state.theme = order[(order.indexOf(state.theme) + 1) % order.length];
    if (state.theme === "auto") {
      document.documentElement.removeAttribute("data-theme");
      themeBtnEl.textContent = "Theme: Auto";
    } else {
      document.documentElement.setAttribute("data-theme", state.theme);
      themeBtnEl.textContent = "Theme: " + (state.theme === "light" ? "Light" : "Dark");
    }
  });

  /* Keyboard Navigation: ↑/↓ findings, 1-6 tiers, / search, ? shortcuts, Esc clear */
  document.addEventListener("keydown", e => {
    const inInput = document.activeElement === searchInputEl;
    if (e.key === "Escape") {
      exportMenuEl.classList.remove("open");
      if (kbdPopEl.classList.contains("open")) { toggleKbd(false); return; }
      if (inInput) {
        if (state.search) {
          state.search = "";
          searchInputEl.value = "";
          render();
        }
        searchInputEl.blur();
      } else if (state.tierFilter !== "ALL") {
        setTierFilter("ALL");
      }
      return;
    }

    if (inInput) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (e.key === "ArrowDown" || e.key === "j") {
      e.preventDefault();
      stepFinding(1);
    } else if (e.key === "ArrowUp" || e.key === "k") {
      e.preventDefault();
      stepFinding(-1);
    } else if (e.key >= "1" && e.key <= "6") {
      e.preventDefault();
      setTierFilter("E" + e.key);
    } else if (e.key === "0") {
      e.preventDefault();
      setTierFilter("ALL");
    } else if (e.key === "/") {
      e.preventDefault();
      searchInputEl.focus();
      searchInputEl.select();
    } else if (e.key === "?") {
      e.preventDefault();
      toggleKbd();
    }
  });

  /* Initial Render */
  document.getElementById("ctVersion").textContent = CASE_META.version;
  const dumpEl = document.getElementById("ctDump");
  dumpEl.textContent = CASE_META.dumpName;
  dumpEl.title = `RAM dump image · SHA-256 ${CASE_META.dumpSha256 || "not recorded"}`;
  document.getElementById("ctDumpSub").innerHTML = `${esc(CASE_META.dumpSize)} <span class="mode-badge ${CASE_META.mode === "PHYSICAL_FALLBACK" ? "degraded" : ""}" title="${esc(CASE_META.mode)}">${esc(human(HUMAN_MODE, CASE_META.mode))}</span>`;
  /* Findings, workflow graphs and artifacts are separate counts: several findings can share one graph. */
  if (COUNTS) {
    document.getElementById("ctInventorySummary").textContent =
      `Case inventory · ${COUNTS.workflow_graphs} distinct workflow graph${COUNTS.workflow_graphs === 1 ? "" : "s"}`;
    document.getElementById("ctCounts").innerHTML = [
      `E1–E3: ${COUNTS.linked_findings} finding(s) · ${COUNTS.linked_workflow_graphs} distinct workflow graph(s) · ${COUNTS.linked_image_artifacts} image artifact(s)`,
      `E4–E6: ${COUNTS.prompt_only_findings} finding(s) · ${COUNTS.workflow_graphs} distinct workflow graph(s) across all tiers`,
      `Untiered: ${COUNTS.untiered_findings} finding(s) · Other images: ${COUNTS.other_images_artifacts.toLocaleString()} artifact(s) in ${COUNTS.other_images_findings} bucket finding(s)`
    ].map(line => `<div>${esc(line)}</div>`).join("");
    document.getElementById("ctInventory").hidden = false;
  }
  render();
})();
</script>
</body>
</html>
