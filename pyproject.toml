[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfytrace"
version = "1.0.0"
description = "ComfyUI memory forensics: recover and correlate workflows and images from Windows and Linux captures."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "" }]
dependencies = [
    "volatility3==2.28.2",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
search = ["ahocorasick-rs>=1,<2"]
runner = ["comfy-cli>=1.28,<2"]
regen = ["imagehash>=4.3.0", "scikit-image>=0.22.0"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
comfytrace = "comfytrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comfytrace = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["groundtruth: integration tests against external lab memory dumps (skipped when unavailable)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/comfytrace/metadata/*.py" = ["E501"]
